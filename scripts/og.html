<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: U; src: url("../src/fonts/unbounded-500.woff2"); font-weight: 500; }
  @font-face { font-family: C; src: url("../src/fonts/cormorant-italic-500.woff2"); font-style: italic; font-weight: 500; }
  @font-face { font-family: O; src: url("../src/fonts/onest-400.woff2"); font-weight: 400; }
  @font-face { font-family: M; src: url("../src/fonts/jetbrains-mono-300.woff2"); font-weight: 300; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f5f2ec; color: #141210; position: relative; overflow: hidden; font-family: O; }
  .rule { position: absolute; top: 0; bottom: 0; left: 64px; width: 5px; border-left: 1.5px solid #e2552c; border-right: 1.5px solid #e2552c; opacity: .6; }
  .sheet { position: absolute; right: 48px; bottom: 0; width: 400px; height: 400px; border: 1px solid rgba(31,77,58,.22); border-bottom: 0;
    background: rgba(236,231,222,.6) repeating-linear-gradient(to bottom, transparent 0 25px, rgba(31,77,58,.2) 25px 26px); }
  .sheet::after { content: ""; position: absolute; top: 0; bottom: 0; left: 70px; width: 4px; border-left: 1px solid rgba(226,85,44,.45); border-right: 1px solid rgba(226,85,44,.45); }
  .portrait { position: absolute; right: 60px; bottom: 0; height: 560px; }
  .logo { position: absolute; left: 104px; top: 52px; display: flex; gap: 14px; align-items: center; font-family: U; font-size: 22px; letter-spacing: -.02em; }
  .mark { width: 30px; height: 38px; background: #1f4d3a; -webkit-mask: url("../public/images/logo-mark.png") center/contain no-repeat; }
  h1 { position: absolute; left: 100px; top: 150px; margin: 0; font-weight: 500; }
  .l1 { display: block; font-family: U; font-size: 92px; letter-spacing: -.06em; line-height: .9; }
  .l2 { display: block; font-family: U; font-size: 44px; letter-spacing: -.05em; margin-top: 22px; }
  .l3 { display: block; font-family: C; font-style: italic; font-size: 58px; color: #1f4d3a; margin-top: 6px; padding-left: 30px; }
  .meta { position: absolute; left: 104px; bottom: 56px; display: flex; gap: 40px; align-items: flex-end; }
  .num { font-family: M; font-weight: 300; font-size: 54px; letter-spacing: -.05em; line-height: 1; padding-bottom: 8px; border-bottom: 2px solid #e2552c; box-shadow: 0 5px 0 -0px #f5f2ec, 0 7px 0 0 #e2552c; }
  .lbl { font-size: 18px; line-height: 1.3; color: #5b554d; }
  .lbl b { color: #141210; font-weight: 400; }
  .city { font-size: 18px; color: #5b554d; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="sheet"></div>
  <img class="portrait" src="../public/images/yevheniia-portrait.webp" alt="" />
  <div class="logo"><img src="../src/app/icon.png" alt="" style="width:44px;height:44px;margin:-6px -4px -6px -10px" />Конкордія</div>
  <h1><span class="l1">Бухгалтерські</span><span class="l2">рішення для бізнесу</span><span class="l3">від Євгенії Турковської</span></h1>
  <div class="meta">
    <div><div class="num">21</div></div>
    <div class="lbl"><b>рік на ринку</b><br />Харків · ФОП · ТОВ · БФ</div>
  </div>
</body>
</html>
